<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gazi MYO Duyuru Takip</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .update-time { font-size: 0.8em; color: #666; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
    @media(min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { border-bottom: 2px solid #003366; padding-bottom: 8px; color: #003366; font-size: 1.2rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #eee; }
    li:last-child { border: none; }
    a { color: #333; text-decoration: none; font-weight: 500; font-size: 0.95rem; display: block; }
    a:hover { color: #003366; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Gazi MYO Duyuruları</h1>
    <div class="update-time" id="sonGuncelleme">Yükleniyor...</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>🏫 MYO Genel Duyurular</h2>
      <ul id="myoList"></ul>
    </div>
    <div class="card">
      <h2>⚙️ Bölüm Duyuruları</h2>
      <ul id="bolumList"></ul>
    </div>
  </div>

  <script>
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('sonGuncelleme').innerText = 'Son Güncelleme: ' + data.son_guncelleme;
        
        const renderList = (elementId, items) => {
          const list = document.getElementById(elementId);
          list.innerHTML = items.length ? '' : '<li>Henüz duyuru yok.</li>';
          items.forEach(item => {
            list.innerHTML += `<li><a href="${item.link}" target="_blank">📄 ${item.baslik}</a></li>`;
          });
        };

        renderList('myoList', data.myo);
        renderList('bolumList', data.bolum);
      });
  </script>
</body>
</html>
